schema_version: 1
experiment: p1_matched_fedavg_fixed_gamma_large_n
matrix_identifier: p1-fixed-gamma-large-n-h2-gamma-1over24
description: Fixed-step large-client-count plateau comparison of matched FedAvg and SCAFFOLD.
study_role: matched_large_n_plateau_validation
research_status: CANDIDATE_THEORY_TEST

model:
  objective: nonlinear_main
  noise: rademacher
  a: 1.0
  tau: 0.5
  sigma2: 1.0

fixed_gamma_large_n:
  H: 2
  gamma_denominator: 24
  N_values: [8, 16, 32, 64, 128]
  seeds: [601, 602, 603, 604, 605, 606, 607, 608]
  initial_x:
    601: -1.0
    602: 0.0
    603: 1.0
    604: -1.0
    605: 0.0
    606: 1.0
    607: -0.5
    608: 0.5

theory:
  B20_fedavg: -0.125
  B20_scaffold: -0.1875
  Delta_B20_scaffold_minus_fedavg: -0.0625
  remainder: O(1/N + gamma)

inference:
  confidence_level: 0.95
  bootstrap_repetitions: 2000
  bootstrap_seed: 20260901
  independent_unit: matched_chain_pair
  extrapolation: C = beta0 + beta1 / N

smoke_test:
  H: 2
  N_values: [8, 16]
  gamma: 0.041666666666666664
  seeds: [701, 702]
  initial_x:
    701: -1.0
    702: 1.0
  burn_in_rounds: 50
  post_burn_rounds: 200
  num_batches: 10
