schema_version: 1
experiment: p1_matched_fedavg
matrix_identifier: p1-matched-fedavg-112-pairs
description: Matched common-random-number comparison of homogeneous FedAvg and SCAFFOLD.
study_role: matched_algorithm_validation
research_status: CANDIDATE_THEORY_TEST

model:
  objective: nonlinear_main
  noise: rademacher
  a: 1.0
  tau: 0.5
  sigma2: 1.0

primary_coefficient_convergence:
  H_values: [2, 4]
  grid:
    - {gamma_denominator: 12, N: 12}
    - {gamma_denominator: 16, N: 16}
    - {gamma_denominator: 24, N: 24}
    - {gamma_denominator: 32, N: 32}
    - {gamma_denominator: 48, N: 48}
  seeds: [301, 302, 303, 304, 305, 306, 307, 308]
  initial_x:
    301: -1.0
    302: 0.0
    303: 1.0
    304: -1.0
    305: 0.0
    306: 1.0
    307: -0.5
    308: 0.5

small_step_h4_confirmation:
  H: 4
  grid:
    - {gamma_denominator: 64, N: 64}
    - {gamma_denominator: 96, N: 96}
    - {gamma_denominator: 128, N: 128}
    - {gamma_denominator: 192, N: 192}
  seeds: [401, 402, 403, 404, 405, 406, 407, 408]
  initial_x:
    401: -1.0
    402: 0.0
    403: 1.0
    404: -1.0
    405: 0.0
    406: 1.0
    407: -0.5
    408: 0.5

inference:
  confidence_level: 0.95
  bootstrap_repetitions: 2000
  bootstrap_seed: 20260831
  independent_unit: matched_chain_pair

smoke_test:
  H: 2
  N: 4
  gamma: 0.05
  seeds: [501, 502]
  initial_x:
    501: -1.0
    502: 1.0
  burn_in_rounds: 50
  post_burn_rounds: 200
  num_batches: 10
