        - 0.018615099646989278

primary_joint_path:
  d: 5
  H_values: [2, 4]
  relation: gamma = 1/N
  remainder_on_path: O(gamma)
  fit_variable: delta = gamma + 1/N
  delta_relation_on_path: delta = 2 * gamma
  forbid_separate_gamma_inverse_N_fit: true
  path:
    - {gamma_denominator: 32, N: 32, delta_numerator: 2, delta_denominator: 32}
    - {gamma_denominator: 48, N: 48, delta_numerator: 2, delta_denominator: 48}
    - {gamma_denominator: 64, N: 64, delta_numerator: 2, delta_denominator: 64}
    - {gamma_denominator: 96, N: 96, delta_numerator: 2, delta_denominator: 96}
    - {gamma_denominator: 128, N: 128, delta_numerator: 2, delta_denominator: 128}

chains:
  independent_unit: chain
  count_per_setting: 8
  seeds: [1201, 1202, 1203, 1204, 1205, 1206, 1207, 1208]
  initial_control: zero

estimators:
  primary: stationary_mean_balance
  secondary_diagnostic: direct_stationary_sample_mean
  primary_representation: signed_coordinatewise
  norm_only_primary_forbidden: true

protocol:
  source: shared/configs/simulation_defaults.yaml
  mixing_mu: 0.8037572789315114
  burn_in_multiples: 100
  batch_length_multiples: 20
  min_batches: 100
  max_batches: 400
  extension_batches: 50
  finite_state_required: true
  max_abs_control_sum: 1.0e-10
  estimator_agreement_z: 3.0
  stationarity_z: 3.0
  stationarity_min_chains: 7

per_setting_uncertainty:
  source: eight_independent_chain_estimates
  method: student_t_coordinatewise
  degrees_of_freedom: 7
  familywise_confidence_level: 0.95
  correction: bonferroni
  coordinates: 5
  simultaneous_coordinate_confidence_level: 0.99
  simultaneous_t_critical: 3.4994832973504924
  marginal_diagnostic_confidence_level: 0.95
  pool_coordinates: false

precision_stopping:
  statistic: primary_balance_normalized_coefficient
  scope: every_coordinate
  simultaneous_interval: bonferroni_familywise_95_percent
  absolute_half_width: 0.0025
  relative_half_width: 0.10
  coordinate_rule: h_j <= max(0.0025, 0.10 * abs(B20_j(H)))
  check_after_batches: 100
  extend_by_batches: 50
  stop_at_batches: 400
  stop_on_invalidity: true

extrapolation:
  per: [H, coordinate]
  response: setting_mean_balance_C_hat_coordinate
  model: C_hat_j = beta0_j + beta1_j * delta
  delta: gamma + 1/N
  coefficient_estimate: beta0_j
  settings_per_fit: 5

bootstrap:
  unit: seed_label_block
  repetitions: 5000
  seed: 3901
  preserve_same_seed_across_settings: true
  simultaneous_familywise_confidence_level: 0.95
  correction: bonferroni
  simultaneous_coordinate_percentile_level: 0.99
  simultaneous_quantiles: [0.005, 0.995]
  marginal_diagnostic_percentile_level: 0.95
  marginal_diagnostic_quantiles: [0.025, 0.975]

gates:
  V0:
    requirement: finite state, zero-sum control validity, stationarity, and matrix completeness
    role: required
  V1:
    requirement: all five H=2 targets lie inside their simultaneous bootstrap intervals
    role: required
  V2:
    requirement: all five H=4 targets lie inside their simultaneous bootstrap intervals
    role: required
  V3:
    requirement: report setting-level sign against the theoretical component
    role: diagnostic_only
  V4:
    requirement: report coordinatewise direct-minus-balance normalized coefficient
    role: diagnostic_only
  V5:
    requirement: exactly ten settings and eighty chains with no missing or unexpected runs
    role: required
  combined_pass_requires: [V0, V1, V2, V5]

artifact_namespace: workstreams/p2_multidimensional_validation/artifacts/formal/p2-d5-controlled-validation
artifact_filenames:
  - run_start_provenance.json
  - run_summary.csv
  - batch_summary.csv
  - setting_summary.csv
  - setting_diagnostics.csv
  - fit_summary.csv
  - bootstrap_intercepts.csv
  - falsification_summary.csv
  - formal_manifest.json
  - p2_d5_controlled_validation_report.md
  - p2_d5_H2_coefficient_convergence.png
  - p2_d5_H4_coefficient_convergence.png
formal_source_policy: clean_commit
formal_output_policy: controlled_staging_and_no_overwrite

interpretation_boundary:
  classification: empirical_validation
  permitted_conclusion: The pre-registered controlled d=5 experiment is consistent with the multidimensional higher-order coefficient for H=2 and H=4 under the frozen coordinatewise simultaneous-bootstrap criterion.
  theory_metadata_only: [B20_local, B20_ctrl]
  excluded_claims:
    - theorem_proven_experimentally
    - arbitrary_dimension_validated
    - fedavg_attribution_in_d5
    - separate_empirical_identification_of_local_and_control
    - heterogeneity
    - state_dependent_noise
    - growing_H
