        - 0.03212843843928615
        - -0.03399786163115589
        - 0.015955799697419393
      B20_local:
        - -0.009349999190974754
        - -0.030386414368029285
        - 0.0214189589595241
        - -0.022665241087437258
        - 0.010637199798279596
      B20_ctrl:
        - -0.004674999595487377
        - -0.015193207184014642
        - 0.01070947947976205
        - -0.011332620543718629
        - 0.005318599899139798
    4:
      B20:
        - -0.04441249615713008
        - -0.14433546824813876
        - 0.10174005505773948
        - -0.10765989516532698
        - 0.050526699041827994
      B20_local:
