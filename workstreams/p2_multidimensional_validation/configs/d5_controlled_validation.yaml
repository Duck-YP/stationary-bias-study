    - [0.01806310274307949, 0.01101626317972773, 0.4049209090598549, 0.03265048452592303, 0.012196223305747204]
    - [-0.0014569479115977557, 0.014117526532011666, 0.03265048452592303, 0.28476945183498037, 0.01918330202416588]
    - [0.000122751340053028, -0.001186982554662978, 0.012196223305747204, 0.01918330202416588, 0.39846533583806676]
  B10:
    - -0.007741472935786256
    - -0.02515889035292379
    - 0.01773415031499783
    - -0.01876602841108497
    - 0.00880723010440575
  by_H:
