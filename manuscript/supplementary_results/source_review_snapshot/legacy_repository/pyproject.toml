[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stationary-bias-study"
version = "1.0.0"
description = "Reproducible numerical study of stationary bias in stochastic federated optimization"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.5",
  "pandas==3.0.1",
  "PyYAML==6.0.3",
  "matplotlib==3.11.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
stationary-bias = "stationary_bias.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
