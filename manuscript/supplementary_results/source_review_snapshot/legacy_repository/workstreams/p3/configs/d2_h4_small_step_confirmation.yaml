schema_version: 1
protocol_status: frozen_not_executed
protocol_frozen_at: "2026-09-18"
experiment: p3_d2_h4_small_step_confirmation
matrix_identifier: p3-d2-h4-small-step-confirmation
study_role: preregistered_formal_smaller_step_confirmation
frozen_before_primary_results: true

objective:
  name: rank_one_log_cosh
  d: 2
  A:
    - [1.2, 0.2]
    - [0.2, 1.0]
  u: [0.7071067811865475, 0.7071067811865475]
  alpha: 0.25
  x_star: [0.0, 0.0]
  global_hessian_bounds: {mu: 0.85, L: 1.565036762718386}

noise:
  name: cholesky_rademacher
  covariance:
    - [1.0, 0.2]
    - [0.2, 0.7]
  covariance_eigenvalues: [0.6, 1.1]
  noncommuting_with_A: true
  A_C_minus_C_A:
    - [0.0, -0.02]
    - [0.02, 0.0]
  construction: epsilon = cholesky(C) @ z
  rademacher_coordinates_independent: true
  resulting_vector_coordinates_may_be_correlated: true
  fresh_across: [chain, communication_round, local_step, client]

theory:
  normalization: C_hat = (b_hat - (gamma / N) * B11_d) / gamma^2
  B11_d_sign_is_intrinsic: true
  remainder: O(1/N + gamma)
  S_C:
    - [0.413009404388715, 0.021943573667712]
    - [0.021943573667712, 0.345611285266458]
  B11_d: [-0.024459428167733, -0.030574285209666]
  H: 4
  B20_FA: [-0.096008032790415, -0.120010040988019]
  target_formula: -((H-1)/4) A^{-1} T[C]

smaller_step_path:
  d: 2
  H: 4
  relation: gamma = 1/N
  remainder_on_path: O(gamma)
  fit_variable: delta = gamma + 1/N
  delta_relation_on_path: delta = 2 * gamma
  forbid_separate_gamma_inverse_N_fit: true
  path:
    - {gamma_denominator: 64, N: 64, delta_numerator: 2, delta_denominator: 64}
    - {gamma_denominator: 96, N: 96, delta_numerator: 2, delta_denominator: 96}
    - {gamma_denominator: 128, N: 128, delta_numerator: 2, delta_denominator: 128}
    - {gamma_denominator: 192, N: 192, delta_numerator: 2, delta_denominator: 192}

chains:
  independent_unit: chain
  count_per_setting: 8
  seeds: [1201, 1202, 1203, 1204, 1205, 1206, 1207, 1208]
  initial_global_state_policy: objective_x_star
  initial_global_state: [0.0, 0.0]

estimators:
  primary: stationary_mean_balance
  secondary_diagnostic: direct_stationary_sample_mean
  primary_representation: signed_coordinatewise
  norm_only_primary_forbidden: true

protocol:
  source: shared/configs/simulation_defaults.yaml
  mixing_mu: 0.85
  burn_in_multiples: 100
  batch_length_multiples: 20
  min_batches: 100
  max_batches: 400
  extension_batches: 50
  finite_state_required: true
  estimator_agreement_z: 3.0
  stationarity_z: 3.0
  stationarity_min_chains: 7

per_setting_uncertainty:
  source: eight_independent_chain_estimates
  method: student_t_coordinatewise
  degrees_of_freedom: 7
  familywise_confidence_level: 0.95
  correction: bonferroni
  coordinates: 2
  simultaneous_coordinate_confidence_level: 0.975
  marginal_diagnostic_confidence_level: 0.95
  pool_coordinates: false

precision_stopping:
  statistic: primary_balance_normalized_coefficient
  scope: every_coordinate
  simultaneous_interval: bonferroni_familywise_95_percent
  absolute_half_width: 0.0025
  relative_half_width: 0.10
  coordinate_rule: h_j <= max(0.0025, 0.10 * abs(B20_FA_j(H)))
  check_after_batches: 100
  extend_by_batches: 50
  stop_at_batches: 400
  stop_on_invalidity: true

extrapolation:
  per: [H, coordinate]
  response: setting_mean_balance_C_hat_coordinate
  model: C_hat_j = beta0_j + beta1_j * delta
  delta: gamma + 1/N
  coefficient_estimate: beta0_j

bootstrap:
  unit: seed_label_block
  repetitions: 2000
  seed: 3902
  preserve_same_seed_across_settings: true
  simultaneous_familywise_confidence_level: 0.95
  correction: bonferroni
  simultaneous_coordinate_percentile_level: 0.975
  simultaneous_quantiles: [0.0125, 0.9875]
  marginal_diagnostic_percentile_level: 0.95
  marginal_diagnostic_quantiles: [0.025, 0.975]

gates:
  F0: every setting passes finite-state, stationarity, and required-chain-count validity
  F3: both H=4 coordinate targets lie within simultaneous smaller-step bootstrap intervals
  F3_closeness: report whether each smaller-step intercept is closer to theory than its primary-path counterpart
  F4: all sufficiently small-path primary balance coordinates have the corresponding theory sign
  F5: direct-versus-balance agreement is diagnostic only
  F6: include every frozen setting and seed without result-dependent exclusion

artifact_namespace: workstreams/p3_multidimensional_fedavg_attribution/artifacts/formal/p3-d2-h4-small-step-confirmation
formal_source_policy: clean_commit
formal_output_policy: controlled_staging_and_overwrite_if_raw_scientific_fields_match
interpretation_boundary: fedavg_coefficient_consistency_test_not_proof_or_matched_attribution
