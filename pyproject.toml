[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stationary-bias-study"
version = "0.0.0"
description = "Scientific source and compact saved evidence for stationary-bias manuscript reproduction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.3", "scipy>=1.15", "numba>=0.61", "pandas>=2.2",
  "PyYAML>=6", "matplotlib>=3.10", "psutil>=7", "threadpoolctl>=3",
  "pypdf>=5", "pdfminer.six>=20240706", "pdfplumber>=0.11", "Pillow>=10",
  "pypdfium2>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Duck-YP/stationary-bias-study"
Manuscript = "https://arxiv.org/abs/2608.26765"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stationary_bias*", "study*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests/bounded"]
